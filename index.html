<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmilePlus">
<title>SmilePlus Dental Care Center</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  #app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#fff;touch-action:pan-y}

  /* Clean crossfade: no zoom and no sliding overlap. */
  .slide{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:1;transition:opacity .7s ease}
  .slide.active{opacity:1;pointer-events:auto;z-index:2}
  .slide img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}

  /* Subtle, stylized navigation arrows. Always visible on touch devices. */
  .controls{position:absolute;inset:0;z-index:10;pointer-events:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(9,75,150,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;font-size:31px;font-weight:300;line-height:44px;padding:0;text-align:center;cursor:pointer;pointer-events:auto;box-shadow:0 2px 8px rgba(0,45,100,.16);transition:background .2s ease,transform .2s ease,opacity .2s ease;opacity:.78}
  .nav:active{transform:translateY(-50%) scale(.94);background:rgba(9,75,150,.48)}
  .prev{left:14px}.next{right:14px}

  .dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;opacity:.8}
  .dot{width:7px;height:7px;border-radius:50%;background:#b9c8dc;border:0;padding:0;cursor:pointer}
  .dot.active{background:#1269d8;width:20px;border-radius:5px}
  .counter{position:absolute;right:14px;bottom:10px;color:#17427e;font-size:12px;font-weight:600;opacity:.65}

  @media (max-width:700px){
    .nav{width:44px;height:44px;font-size:28px;line-height:40px}
    .prev{left:9px}.next{right:9px}
  }
  @media (prefers-reduced-motion:reduce){.slide{transition:opacity .2s ease}.nav{transition:none}}
</style>
</head>
<body>
<div id="app" aria-label="SmilePlus Dental Care Center slideshow">
  <section class="slide active" data-index="0"><img src="assets/01-braces-promo.png" alt="SmilePlus slide 1"></section>
  <section class="slide" data-index="1"><img src="assets/02-branches-services.png" alt="SmilePlus slide 2"></section>
  <section class="slide" data-index="2"><img src="assets/03-general-dentistry.png" alt="SmilePlus slide 3"></section>
  <section class="slide" data-index="3"><img src="assets/04-oral-surgery.png" alt="SmilePlus slide 4"></section>
  <section class="slide" data-index="4"><img src="assets/05-esthetic-dentistry.png" alt="SmilePlus slide 5"></section>
  <section class="slide" data-index="5"><img src="assets/06-teeth-whitening.png" alt="SmilePlus slide 6"></section>
  <section class="slide" data-index="6"><img src="assets/07-orthodontics.png" alt="SmilePlus slide 7"></section>
  <section class="slide" data-index="7"><img src="assets/08-panoramic-xray.png" alt="SmilePlus slide 8"></section>
  <section class="slide" data-index="8"><img src="assets/09-tap-to-register.png" alt="SmilePlus slide 9"></section>

  <div class="controls">
    <button class="nav prev" type="button" aria-label="Previous slide">‹</button>
    <button class="nav next" type="button" aria-label="Next slide">›</button>
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
(() => {
  const slides=[...document.querySelectorAll('.slide')];
  const dots=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const app=document.getElementById('app');
  let index=0,timer=null,startX=null,startY=null;
  const BOOKING_URL="https://dental.m.mymedsph.app/dental/mJKUmCGB3";
  const INTERVAL=5000;

  slides.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(i===0?' active':'');
    b.type='button';
    b.setAttribute('aria-label','Go to slide '+(i+1));
    b.addEventListener('click',()=>go(i));
    dots.appendChild(b);
  });

  function render(){
    slides.forEach((s,i)=>s.classList.toggle('active',i===index));
    [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===index));
    counter.textContent=(index+1)+' / '+slides.length;
  }
  function go(i){index=(i+slides.length)%slides.length;render();restart()}
  function next(){go(index+1)}
  function prev(){go(index-1)}
  function restart(){clearInterval(timer);timer=setInterval(next,INTERVAL)}
  function openBooking(){window.open(BOOKING_URL,'_blank','noopener')}

  document.querySelector('.next').addEventListener('click',e=>{e.stopPropagation();next()});
  document.querySelector('.prev').addEventListener('click',e=>{e.stopPropagation();prev()});

  app.addEventListener('click',e=>{
    if(e.target.closest('.nav,.dots,.dot'))return;
    if(e.target.closest('.slide'))openBooking();
  });

  app.addEventListener('touchstart',e=>{
    const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;
  },{passive:true});
  app.addEventListener('touchend',e=>{
    if(startX===null)return;
    const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;
    startX=startY=null;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){
      dx<0?next():prev();
      return;
    }
    if(!e.target.closest('.nav,.dots,.dot')&&e.target.closest('.slide'))openBooking();
  },{passive:true});

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key===' ')next();
    if(e.key==='ArrowLeft')prev();
  });

  render();
  restart();
})();
</script>
</body>
</html>
